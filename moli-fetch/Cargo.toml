[package]
license.workspace = true
name = "moli-fetch"
version = "0.1.0"
edition = "2024"

[features]
default = []
test-support = ["moli-cookie-jar/test-support"]

[dependencies]
anyhow.workspace = true
async-compression = { workspace = true, features = ["tokio", "gzip", "zlib", "brotli", "zstd"] }
bytes.workspace = true
cidr.workspace = true
http.workspace = true
moli-browser-profile.workspace = true
moli-cookie-jar.workspace = true
moli-dns-resolver.workspace = true
moli-http-cache.workspace = true
moli-stealth-net.workspace = true
moli-trace.workspace = true
moli-url.workspace = true
moli-url-policy.workspace = true
moli-web-bot-auth.workspace = true
moli-web-mime.workspace = true
parking_lot.workspace = true
strum = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["io-util", "rt", "sync", "time"] }
tracing.workspace = true
url.workspace = true
wildcard.workspace = true

[dev-dependencies]
h2.workspace = true
moli-cookie-jar = { workspace = true, features = ["test-support"] }
rcgen = { workspace = true, features = ["aws_lc_rs"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs", "logging", "tls12"] }

[lints]
workspace = true
