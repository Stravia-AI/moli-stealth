[package]
license.workspace = true
name = "moli-core"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Compile renderer-only testing and diagnostic projections. This is not part of
# normal browser behavior and must stay disabled in production builds.
test-support = ["moli-renderer-v8/test-support"]
# Forward the renderer's WPT-only test harness globals. This must stay opt-in:
# normal Moli pages should not expose `window.webdriver` / `window.WebDriver`.
wpt-extensions = ["moli-renderer-v8/wpt-extensions"]

[dependencies]
anyhow.workspace = true
moli-browser-profile.workspace = true
moli-dom.workspace = true
moli-parser.workspace = true
moli-page-types.workspace = true
moli-renderer-v8.workspace = true
moli-selector.workspace = true
moli-storage-key.workspace = true
moli-storage-service.workspace = true
moli-url.workspace = true
moli-web-mime.workspace = true
moli-cookie-jar.workspace = true
moli-fetch.workspace = true
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
moli-fetch = { workspace = true, features = ["test-support"] }
moli-parser = { workspace = true, features = ["test-support"] }
# Integration tests compile moli-core as a normal dependency, so `cfg(test)` in
# moli-renderer-v8 would not apply. Enable the renderer feature through this
# dev-dependency instead; production dependencies keep it disabled by default.
moli-renderer-v8 = { workspace = true, features = ["test-support", "wpt-extensions"] }
moli-test-support.workspace = true
moli-wpt-compat.workspace = true
strip-ansi-escapes.workspace = true
static_assertions.workspace = true

[lints]
workspace = true
