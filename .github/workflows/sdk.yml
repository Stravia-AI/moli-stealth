name: Precompiled Rust SDK

on:
  push:
    branches: ['sdk-validation/**']
    # 绑定提交引用已验证的实现，不能再以自身身份重打包并形成绑定循环。
    paths-ignore: ['moli-sdk/artifacts.json']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Intended fixed SDK Release tag (validation does not create a Release)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Static implementation / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            image: ''
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            image: ''
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            image: debian:12
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            image: debian:12
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            image: alpine:3.23
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            image: alpine:3.23
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.0'
          cache: false
      - name: Install pinned NASM for Windows x64
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nasm.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'nasm'
          Invoke-WebRequest 'https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '3ee4782247bcb874378d02f7eab4e294a84d3d15f3f6ee2de2f47a46aa7226e6') {
              throw 'NASM archive SHA-256 mismatch'
          }
          Expand-Archive $archive -DestinationPath $destination
          $bin = Join-Path $destination 'nasm-2.16.03'
          $bin | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $bin 'nasm.exe') -v
      - name: Build on native Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # V8 完整子模块中的 libc++ 路径超过 Windows MAX_PATH；Cargo 的 libgit2 同样需要此设置。
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Could not enable Git long paths for the native SDK build' }
          ./scripts/sdk-windows.ps1 -Mode build -Target '${{ matrix.target }}'
      - name: Build in native baseline Linux container
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          swapfile="$RUNNER_TEMP/moli-sdk.swap"
          sudo fallocate -l 8G "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h
          docker run --rm --volume "$PWD:/src" --volume "$(go env GOROOT):/opt/go:ro" \
            --env CARGO_BUILD_JOBS=2 \
            --workdir /src '${{ matrix.image }}' sh scripts/sdk-linux.sh build '${{ matrix.target }}'
      - name: Report Linux build resources on failure
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: |
          free -h
          df -h
          sudo journalctl --dmesg --no-pager
      - name: Upload implementation, identity and matching symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-${{ matrix.target }}
          path: |
            dist/sdk/*.tar.gz
            dist/sdk/*.json
            dist/sdk/work-*/build.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  bind:
    name: Bind six real archives to SDK source
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      sdk_revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sdk-*
          path: artifacts
      - name: Verify every archive and derive trusted binding
        env:
          SDK_RELEASE: ${{ inputs.release_tag || format('sdk-validation-{0}', github.sha) }}
          SDK_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/sdk-bind.py bind --artifacts artifacts --repository "$SDK_REPOSITORY" --release "$SDK_RELEASE"
      - name: Create local final SDK revision, without push or publication
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'SDK validation'
          git config user.email 'sdk-validation@users.noreply.github.com'
          git switch -c sdk-bound
          git add moli-sdk/artifacts.json
          git commit -m '绑定 SDK 到已验证的实现归档'
          mkdir -p bound
          git bundle create bound/sdk-bound.bundle "${GITHUB_SHA}..sdk-bound"
          git rev-parse HEAD > bound/sdk-revision.txt
          cp moli-sdk/artifacts.json bound/artifacts.json
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-final-binding
          path: bound/
          if-no-files-found: error
          retention-days: 7

  consume:
    name: Bound external consumer / ${{ matrix.target }}
    needs: bind
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            image: ''
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            image: ''
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            image: debian:12
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            image: debian:12
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            image: alpine:3.23
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            image: alpine:3.23
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-final-binding
          path: bound
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-${{ matrix.target }}
          path: artifacts
      - name: Verify native Windows imports and real consumer behavior
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/sdk-windows.ps1 -Mode verify -Target '${{ matrix.target }}'
      - name: Verify native baseline runtime, fonts and imports
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --volume "$PWD:/src" --workdir /src '${{ matrix.image }}' \
            sh scripts/sdk-linux.sh verify '${{ matrix.target }}'
      - name: Upload actual runtime and build-cost evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-evidence-${{ matrix.target }}
          path: dist/evidence/
          if-no-files-found: warn
          retention-days: 7

  validated:
    name: All six native consumers passed
    needs: [bind, consume]
    runs-on: ubuntu-24.04
    steps:
      - name: Record validation identity, not publication
        env:
          SDK_REVISION: ${{ needs.bind.outputs.sdk_revision }}
        run: |
          echo "Six native external consumer jobs passed for SDK revision $SDK_REVISION." >> "$GITHUB_STEP_SUMMARY"
          echo 'Each target retained the Rust 1.96.1 consumer checks and freshly linked and ran the same bound SDK with a native Rust 1.98.1 debug host in an independent target directory. Both consumer executables passed the native dependency audit; this validates these fixed versions, not arbitrary Rust versions.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Archives and local bound Git bundle are Actions artifacts only. No Release, push or crate publication was performed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Default network download from the intended Release remains a separate authorized publication check; these jobs use verified preseeded cache.' >> "$GITHUB_STEP_SUMMARY"
