[package]
license.workspace = true
name = "moli-webcrypto"
version = "0.1.0"
edition = "2024"
description = "Renderer-neutral WebCrypto algorithms, keys, and JWK validation for Moli"

[dependencies]
base64.workspace = true
ed448-goldilocks = { workspace = true, features = ["alloc", "signing"] }
moli-crypto.workspace = true
openssl = { workspace = true, features = ["aws-lc"] }
pkcs8 = { workspace = true, features = ["alloc"] }
serde = { workspace = true, features = ["derive"] }
strum = { workspace = true, features = ["derive"] }
x448 = { workspace = true, features = ["static_secrets"] }
zeroize.workspace = true

[lints]
workspace = true
