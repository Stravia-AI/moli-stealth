[project]
name = "moli-cdp-smoke"
version = "0.1.0"
description = "CDP smoke tests for moli"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.48,<2",
  "websockets>=13,<16",
]

[project.scripts]
moli-cdp-smoke = "moli_cdp_smoke.supervisor:main"
moli-cdp-smoke-worker = "moli_cdp_smoke.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moli_cdp_smoke"]
