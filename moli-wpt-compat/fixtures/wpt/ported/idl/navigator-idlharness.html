<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script src="/wpt/resources/WebIDLParser.js"></script>
<script src="/wpt/resources/idlharness.js"></script>
<script>
idl_test([`
interface Navigator {
  boolean javaEnabled();
  boolean sendBeacon(USVString url, optional object data = null);
  Promise<any> getBattery();
  readonly attribute DOMString userAgent;
  readonly attribute DOMString appName;
  readonly attribute DOMString appVersion;
  readonly attribute DOMString platform;
  readonly attribute DOMString language;
  readonly attribute any languages;
  readonly attribute boolean onLine;
  readonly attribute boolean cookieEnabled;
  readonly attribute unsigned long hardwareConcurrency;
  readonly attribute unsigned long maxTouchPoints;
  readonly attribute DOMString vendor;
  readonly attribute DOMString product;
  readonly attribute boolean webdriver;
  readonly attribute any mimeTypes;
  readonly attribute any plugins;
  readonly attribute boolean pdfViewerEnabled;
};
`], [], function (idlArray) {
  idlArray.enable_function_length_assertions();
  idlArray.enable_operation_descriptor_assertions();
  idlArray.enable_interface_descriptor_assertions();
  idlArray.enable_attribute_descriptor_assertions();
  idlArray.enable_object_brand_assertions();
  idlArray.add_objects({
    Navigator: ["navigator"]
  });
});

promise_test(async function () {
  assert_equals(Object.prototype.toString.call(navigator), "[object Navigator]");
  assert_false(Object.prototype.hasOwnProperty.call(navigator, "userAgent"), "navigator should not own userAgent");
  assert_false(Object.prototype.hasOwnProperty.call(navigator, "languages"), "navigator should not own languages");
  assert_false(Object.prototype.hasOwnProperty.call(navigator, "mimeTypes"), "navigator should not own mimeTypes");
  assert_false(Object.prototype.hasOwnProperty.call(navigator, "plugins"), "navigator should not own plugins");
  assert_false(Object.prototype.hasOwnProperty.call(navigator, "cookieEnabled"), "navigator should not own cookieEnabled");
  assert_false(Object.prototype.hasOwnProperty.call(navigator, "javaEnabled"), "navigator should not own javaEnabled");
  assert_false(Object.prototype.hasOwnProperty.call(navigator, "sendBeacon"), "navigator should not own sendBeacon");
  assert_false(Object.prototype.hasOwnProperty.call(navigator, "getBattery"), "navigator should not own getBattery");
  assert_true(navigator.userAgent.length > 0);
  assert_equals(navigator.appName, "Netscape");
  assert_equals(navigator.appVersion, navigator.userAgent.replace(/^Mozilla\//, ""));
  assert_equals(navigator.language, "en-US");
  assert_array_equals(navigator.languages, ["en-US", "en"]);
  assert_equals(navigator.languages, navigator.languages);
  assert_true(navigator.onLine);
  assert_true(navigator.cookieEnabled);
  assert_equals(navigator.hardwareConcurrency, 8);
  assert_equals(navigator.maxTouchPoints, 0);
  assert_equals(navigator.vendor, "Google Inc.");
  assert_equals(navigator.product, "Gecko");
  assert_false(navigator.webdriver, "navigator.webdriver should stay false");
  assert_false(navigator.javaEnabled(), "navigator.javaEnabled() should stay false");
  assert_true(navigator.pdfViewerEnabled, "navigator.pdfViewerEnabled should stay true");
  assert_equals(navigator.mimeTypes.length, 2);
  assert_equals(navigator.mimeTypes, navigator.mimeTypes);
  assert_equals(navigator.plugins.length, 5);
  assert_equals(navigator.plugins, navigator.plugins);
  assert_equals(typeof navigator.sendBeacon, "function");
  const battery = await navigator.getBattery();
  assert_equals(typeof battery, "object");
}, "Navigator idlharness sample operations expose stable profile and helpers");
</script>
