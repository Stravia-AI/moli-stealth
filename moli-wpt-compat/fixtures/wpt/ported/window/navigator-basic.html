<!doctype html>
<meta charset="utf-8">

<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function assert_throws_name(expectedName, callback, description) {
  try {
    callback();
  } catch (error) {
    assert_equals(error.name, expectedName, description);
    return;
  }
  throw new Error(description || "expected exception");
}

function assert_collection_item_unsigned_long_conversion(collection, first, second, label) {
  assert_equals(collection.item(0), first, label + " item(0)");
  assert_equals(collection.item(1), second, label + " item(1)");
  assert_equals(collection.item(collection.length), null, label + " out-of-range item() returns null");
  assert_equals(collection.item(-1), null, label + " wrapped negative index returns null when out of range");
  assert_throws_name("TypeError", () => collection.item(), label + " item() should require its index argument");
  assert_equals(collection.item(undefined), first, label + " explicit undefined should convert to zero");
  assert_equals(collection.item(null), first, label + " null should convert to zero");
  assert_equals(collection.item("1.9"), second, label + " string decimals should truncate through unsigned long conversion");
  assert_equals(collection.item(NaN), first, label + " NaN should convert to zero");
  assert_equals(collection.item(Infinity), first, label + " Infinity should convert to zero");
  assert_equals(collection.item(-4294967295), second, label + " negative values should wrap through unsigned long conversion");
  assert_equals(collection.item(4294967297), second, label + " large values should wrap through unsigned long conversion");
  assert_equals(
    collection.item({
      valueOf() { return {}; },
      toString() { return "1"; },
    }),
    second,
    label + " object values should fall back to toString during unsigned long conversion"
  );
  assert_throws_name("Error", () => {
    collection.item({ valueOf() { throw new Error("item conversion failed"); } });
  }, label + " item() should propagate object conversion exceptions");
  assert_throws_name("TypeError", () => collection.item(Symbol("index")), label + " item() should reject Symbol conversion");
  assert_throws_name("TypeError", () => collection.item(1n), label + " item() should reject BigInt conversion");
}

test(function () {
  assert_true(window.navigator === navigator);
  assert_equals(typeof navigator.userAgent, "string");
  assert_true(navigator.userAgent.length > 0);
  assert_equals(navigator.appName, "Netscape");
  assert_equals(navigator.appVersion, navigator.userAgent.replace(/^Mozilla\//, ""));
  assert_equals(typeof navigator.platform, "string");
  assert_true(navigator.platform.length > 0);
}, "navigator exposes identity and user agent profile fields");

test(function () {
  assert_equals(navigator.language, "en-US");
  assert_true(Array.isArray(navigator.languages));
  assert_equals(navigator.languages.length, 2);
  assert_equals(navigator.languages[0], "en-US");
  assert_equals(navigator.languages[1], "en");
}, "navigator exposes language fields");

test(function () {
  assert_true(navigator.onLine);
  assert_true(navigator.cookieEnabled);
  assert_equals(navigator.hardwareConcurrency, 8);
  assert_equals(navigator.maxTouchPoints, 0);
  assert_equals(navigator.vendor, "Google Inc.");
  assert_equals(navigator.product, "Gecko");
  assert_false(navigator.javaEnabled());
  assert_false(navigator.webdriver);
}, "navigator exposes common capability fields");

test(function () {
  assert_equals(Object.prototype.toString.call(navigator.mimeTypes), "[object MimeTypeArray]");
  assert_equals(Object.prototype.toString.call(navigator.plugins), "[object PluginArray]");
  assert_equals(navigator.mimeTypes.length, 2);
  assert_equals(navigator.plugins.length, 5);
  assert_collection_item_unsigned_long_conversion(
    navigator.mimeTypes,
    navigator.mimeTypes[0],
    navigator.mimeTypes[1],
    "MimeTypeArray"
  );
  assert_true(!!navigator.mimeTypes.namedItem("application/pdf"));
  assert_collection_item_unsigned_long_conversion(
    navigator.plugins,
    navigator.plugins[0],
    navigator.plugins[1],
    "PluginArray"
  );
  assert_collection_item_unsigned_long_conversion(
    navigator.plugins[0],
    navigator.plugins[0][0],
    navigator.plugins[0][1],
    "Plugin"
  );
  assert_equals(navigator.plugins.namedItem("PDF"), null);
  assert_equals(navigator.plugins.refresh(), undefined);
  assert_true(navigator.pdfViewerEnabled);
}, "navigator exposes plugin and mime type collections with item() unsigned long conversion");

promise_test(async function () {
  assert_equals(typeof navigator.sendBeacon, "function");

  assert_equals(navigator.connection.effectiveType, "4g");
  assert_equals(navigator.connection.downlink, 10);
  assert_equals(navigator.connection.rtt, 50);
  assert_false(navigator.connection.saveData);

  const battery = await navigator.getBattery();
  assert_equals(typeof battery, "object");
  assert_equals(typeof navigator.permissions.query, "function");
  assert_equals(typeof navigator.storage.estimate, "function");
  assert_equals(typeof navigator.serviceWorker.register, "function");
}, "navigator exposes low-dependency helper surfaces");
</script>
