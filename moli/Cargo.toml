[package]
name = "moli"
version = "1.1.5"
edition = "2024"
license.workspace = true

[[bin]]
name = "moli"
path = "src/main.rs"

[features]
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemalloc-sys", "dep:tikv-jemallocator"]

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
cidr.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
moli-browser-profile.workspace = true
moli-cookie-cache.workspace = true
moli-protocol.workspace = true
moli-cookie-jar.workspace = true
moli-fetch.workspace = true
moli-core.workspace = true
moli-process-signal.workspace = true
moli-protocol-server.workspace = true
moli-robots.workspace = true
moli-stealth-net.workspace = true
parking_lot.workspace = true
regex.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
url.workspace = true

# Keep the existing jemalloc fallback only where rusty_v8 does not publish a
# pointer-compressed PartitionAlloc archive. Windows keeps its system allocator.
[target.'cfg(all(not(target_os = "windows"), not(any(all(target_os = "linux", target_env = "gnu", target_arch = "x86_64"), all(target_os = "macos", any(target_arch = "x86_64", target_arch = "aarch64"))))))'.dependencies]
tikv-jemalloc-sys = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, features = ["override_allocator_on_supported_platforms"], optional = true }

[dev-dependencies]
libc.workspace = true
moli-test-support.workspace = true
strip-ansi-escapes.workspace = true

[lints]
workspace = true
