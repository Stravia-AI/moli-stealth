[package]
name = "moli"
version = "0.1.1"
edition = "2024"
license.workspace = true

[[bin]]
name = "moli"
path = "src/main.rs"

[features]
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemalloc-sys", "dep:tikv-jemallocator"]

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.6", features = ["ws"] }
base64 = "0.22"
cidr = "0.3.2"
clap = { version = "4.5.39", features = ["derive"] }
flate2 = "1.1.9"
futures-util = "0.3.31"
moli-browser-profile = { path = "../moli-browser-profile" }
moli-bounded-json = { path = "../moli-bounded-json" }
moli-cookie-cache = { path = "../moli-cookie-cache" }
moli-protocol-cdp = { path = "../moli-protocol-cdp" }
moli-protocol = { path = "../moli-protocol" }
moli-cookie-jar = { path = "../moli-cookie-jar" }
moli-dom = { path = "../moli-dom" }
moli-fetch = { path = "../moli-fetch" }
moli-core = { path = "../moli-core" }
moli-process-signal = { path = "../moli-process-signal" }
moli-trace = { path = "../moli-trace" }
moli-protocol-webdriver-bidi = { path = "../moli-protocol-webdriver-bidi" }
moli-protocol-webdriver-classic = { path = "../moli-protocol-webdriver-classic" }
parking_lot = "0.12"
percent-encoding = "2.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
socket2 = { version = "0.6.3", features = ["all"] }
tokio = { version = "1.51.0", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tikv-jemalloc-sys = { version = "0.7.1", optional = true, default-features = false }
tikv-jemallocator = { version = "0.7.0", optional = true, default-features = false, features = ["override_allocator_on_supported_platforms"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
url = "2.5.7"

[dev-dependencies]
libc = "0.2"
moli-protocol = { path = "../moli-protocol", features = ["test-support"] }
moli-test-support = { path = "../moli-test-support" }
png = "0.17"
strip-ansi-escapes = "0.2.1"
time = "0.3"
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5.2", features = ["util"] }

[lints]
workspace = true
