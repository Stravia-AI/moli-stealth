[package]
license.workspace = true
name = "moli-renderer-v8"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Diagnostic-only page-created global snapshots. Core integration tests enable
# this through a dev-dependency; normal browser builds leave it compiled out.
test-support = []
# Test-harness only. Enables non-standard WPT WebDriver globals
# (`window.webdriver` / `window.WebDriver`) used by imported WPT tests.
# Keep disabled for normal browser builds so page scripts do not see this test surface.
wpt-extensions = []

[dependencies]
anyhow.workspace = true
app_units.workspace = true
base64.workspace = true
brotlic.workspace = true
crossbeam-channel.workspace = true
cssparser.workspace = true
data-url.workspace = true
dom.workspace = true
encoding_rs.workspace = true
euclid.workspace = true
flate2 = { workspace = true, features = ["zlib"] }
kurbo.workspace = true
futures-util.workspace = true
precomputed-hash.workspace = true
percent-encoding.workspace = true
selectors.workspace = true
stylo.workspace = true
stylo_static_prefs.workspace = true
moli-action-window.workspace = true
moli-broadcast-channel.workspace = true
moli-browser-profile.workspace = true
moli-crypto.workspace = true
moli-css-parse.workspace = true
moli-dom.workspace = true
moli-parser.workspace = true
moli-page-types.workspace = true
moli-protocol-cdp.workspace = true
moli-selector.workspace = true
moli-shared-worker.workspace = true
moli-storage-service.workspace = true
moli-cookie-jar.workspace = true
moli-canvas.workspace = true
moli-encoding.workspace = true
moli-encoding-detector.workspace = true
moli-fetch.workspace = true
moli-stealth-net.workspace = true
moli-file-api.workspace = true
moli-geometry.workspace = true
moli-http-cache.workspace = true
moli-image.workspace = true
moli-import-map.workspace = true
moli-indexeddb.workspace = true
moli-local-executor.workspace = true
moli-layout.workspace = true
moli-message-port.workspace = true
moli-multipart.workspace = true
moli-module-script-tree.workspace = true
moli-module-syntax.workspace = true
moli-owner-queue.workspace = true
moli-paint.workspace = true
moli-script.workspace = true
moli-stylesheet-blocking.workspace = true
moli-storage-key.workspace = true
moli-streams.workspace = true
moli-structured-clone.workspace = true
moli-svg.workspace = true
moli-time.workspace = true
moli-trace.workspace = true
moli-url.workspace = true
moli-url-policy.workspace = true
moli-v8-init.workspace = true
moli-v8-platform.workspace = true
moli-v8-util.workspace = true
moli-web-errors.workspace = true
moli-web-mime.workspace = true
moli-webcrypto.workspace = true
moli-webapi-declare.workspace = true
moli-webidl.workspace = true
moli-webidl-callback.workspace = true
moli-websocket.workspace = true
moli-xpath.workspace = true
http.workspace = true
httpdate.workspace = true
html-escape.workspace = true
html5ever.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
markup5ever.workspace = true
xml5ever.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_v8.workspace = true
strum = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
widestring.workspace = true
style_traits.workspace = true
xmlparser.workspace = true
typed-num = { workspace = true, features = ["serde"] }
wasm_dep_analyzer.workspace = true

# rusty_v8 publishes pointer-compressed archives for these targets. Those
# archives also provide the process-wide PartitionAlloc allocator shim.
[target.'cfg(any(all(target_os = "linux", target_env = "gnu", target_arch = "x86_64"), all(target_os = "macos", any(target_arch = "x86_64", target_arch = "aarch64"))))'.dependencies]
v8 = { workspace = true, features = ["v8_enable_pointer_compression"] }

# Keep the upstream V8 configuration on targets without an official
# pointer-compressed archive.
[target.'cfg(not(any(all(target_os = "linux", target_env = "gnu", target_arch = "x86_64"), all(target_os = "macos", any(target_arch = "x86_64", target_arch = "aarch64")))))'.dependencies]
v8.workspace = true

[dev-dependencies]
fastrand.workspace = true
moli-fetch = { workspace = true, features = ["test-support"] }
moli-parser = { workspace = true, features = ["test-support"] }
moli-page-types = { workspace = true, features = ["test-support"] }
moli-v8-test-util.workspace = true
moli-websocket = { workspace = true, features = ["test-support"] }
png.workspace = true
wuff.workspace = true

[lints]
workspace = true
