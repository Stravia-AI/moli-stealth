[workspace]
members = ["btls-sys"]
default-members = ["btls-sys"]
resolver = "2"

[workspace.package]
version = "0.5.6"
repository = "https://github.com/0x676e67/btls"
edition = "2021"
rust-version = "1.85"

[workspace.metadata.release]
pre-release-commit-message = "Release {{version}}"
shared-version = true
tag-prefix = ""
publish = false

[workspace.dependencies]
bindgen = { version = "0.72.0", default-features = false, features = ["runtime"] }
cmake = "0.1.58"
fs_extra = "1.3.0"
fslock = "0.2"
