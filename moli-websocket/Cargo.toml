[package]
license.workspace = true
name = "moli-websocket"
version = "0.1.0"
edition = "2024"

[features]
test-support = ["dep:rcgen", "dep:tokio-rustls", "dep:tokio-tungstenite"]

[dependencies]
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
moli-stealth-net = { path = "../moli-stealth-net" }
moli-url = { path = "../moli-url" }
rand = "0.9"
ratchet_rs = { version = "=1.2.1", features = ["deflate", "split"] }
sha1 = "0.10"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"], optional = true }
tokio = { version = "1.51.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"], optional = true }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["handshake"], optional = true }
url = "2.5.7"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }

[lints]
workspace = true
