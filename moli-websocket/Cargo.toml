[package]
license.workspace = true
name = "moli-websocket"
version = "0.1.0"
edition = "2024"

[features]
test-support = ["dep:rcgen"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
moli-url = { path = "../moli-url" }
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "prefer-post-quantum", "std", "tls12"] }
tokio = { version = "1.51.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["handshake", "__rustls-tls"] }
url = "2.5.7"
webpki-roots = "1"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"] }

[lints]
workspace = true
