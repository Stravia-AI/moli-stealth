[package]
license.workspace = true
name = "moli-stealth-net"
version = "0.1.0"
edition = "2024"

[package.metadata.browseroxide-sync]
repository = "https://github.com/yfedoseev/browser_oxide.git"
base-revision = "9cd4af36b744bc8f9047bcceeb341610a6f32109"
source-root = "crates/browser_oxide/src"
imported-paths = ["net"]

[dependencies]
base64 = "0.23"
boring2 = { package = "btls", git = "https://github.com/0x676e67/btls.git", rev = "de7ab84fdb58641a2bdfdf9d8ebd7db1dcf4b29b" }
boring-sys2 = { package = "btls-sys", git = "https://github.com/0x676e67/btls.git", rev = "de7ab84fdb58641a2bdfdf9d8ebd7db1dcf4b29b", features = ["prefix-symbols"] }
brotli = "8"
bytes = "1"
foreign-types = "0.5"
futures-util = "0.3"
http = "1"
http2 = { version = "0.5", features = ["unstable"] }
httparse = "1"
parking_lot = "0.12"
percent-encoding = "2"
rand = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-boring2 = { package = "tokio-btls", git = "https://github.com/0x676e67/btls.git", rev = "de7ab84fdb58641a2bdfdf9d8ebd7db1dcf4b29b" }
url = "2"
webpki-root-certs = "1.0"

[dev-dependencies]
h2 = "0.4"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }

[lints]
workspace = true
